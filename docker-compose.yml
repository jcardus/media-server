# All containers ship stdout/stderr to CloudWatch Logs, one stream per
# container in a single group. The host is not on AWS, so dockerd itself needs
# credentials, and it runs without HOME: the systemd drop-in
# /etc/systemd/system/docker.service.d/aws-credentials.conf sets
# AWS_SHARED_CREDENTIALS_FILE=/root/.aws/credentials. non-blocking keeps a CloudWatch
# outage from stalling the services; docker's local cache keeps `docker logs`
# working.
x-cloudwatch: &cloudwatch
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:-us-east-1}
    awslogs-group: ${CLOUDWATCH_LOG_GROUP:-media-server}
    awslogs-create-group: "true"
    tag: "{{.Name}}"
    mode: non-blocking
    max-buffer-size: 4m

services:
  jt1078:
    build: ./jt1078
    container_name: jt1078
    restart: unless-stopped
    depends_on:
      - mediamtx
    ports:
      - "10002:10002"
      - "10003:10003"
      - "10004:10004"
      # Active-safety alarm attachments (0x1210/0x1211/0x1212 after a 0x9208);
      # point Traccar's huabao.activeSafetyPort here.
      - "10006:10006"
    environment:
      - JT1078_LIVE_PORT=10002
      - JT1078_PLAYBACK_PORT=10003
      - JT1078_STATUS_PORT=10004
      - JT1078_ATTACHMENT_PORT=10006
      - JT1078_CHANNEL_OFFSET=1
      - JT1078_VIDEO_CODEC=h264
      # JT/T 1078 payload type 19 reported by the camera is AAC.
      - JT1078_AUDIO_CODEC=aac
      - JT1078_AUDIO_SAMPLE_RATE=8000
      - FFMPEG_LOG_LEVEL=verbose
    # verbose ffmpeg output across ~15 live streams writes a per-frame line
    # twice a second (this container's json log once reached 6 GB), so this
    # is by far the largest CloudWatch stream: lower FFMPEG_LOG_LEVEL if
    # ingestion cost matters more than the detail.
    logging: *cloudwatch

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "1936:1936"   # RTMP — Jimi cameras push to rtmp://host:1936/live/{channel}/{imei} (DNS-only)
      - "8189:8189/udp" # WebRTC ICE media
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings
    environment:
      - MTX_LOGLEVEL=info
    logging: *cloudwatch

  # Event-attachment sink: JT/T 808 dashcams POST /upload here (direct, plain
  # HTTP to host:10005) after a VIDEOUPLOAD command; files served back for the
  # frontend. See upload/main.py.
  upload:
    build: ./upload
    container_name: media-upload
    restart: unless-stopped
    ports:
      - "10005:10005"
    environment:
      - UPLOAD_PORT=10005
      - STORE_DIR=/data/attachments
    volumes:
      # Event clips grow without bound; point ATTACHMENTS_DIR (in .env) at a
      # dedicated volume in production.
      - ${ATTACHMENTS_DIR:-./attachments}:/data/attachments
    logging: *cloudwatch

  # Edge on :80 for media.n-gps.com: MediaMTX WebRTC as before, plus
  # /media-status/ -> jt1078 :10004 /status endpoint and /attachments/ -> upload.
  nginx:
    image: nginx:alpine
    container_name: media-nginx
    restart: unless-stopped
    depends_on:
      - mediamtx
      - jt1078
      - upload
    ports:
      - "80:80"       # WebRTC — browsers open https://media.n-gps.com/... (Cloudflare-proxied)
    volumes:
      - ./nginx/media-edge.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *cloudwatch
