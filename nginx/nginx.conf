server {
    listen 80;

    location /player {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /player/index.html;
    }

    location /media-status/ {
        # jt1078 per-camera publish status — the frontend polls this after a
        # videoStart command to tell "camera hasn't connected" from
        # "connected but stream broke". Trailing slash strips the prefix:
        # /media-status/status/{imei}/{ch} -> jt1078:/status/{imei}/{ch}
        proxy_pass http://jt1078:10004/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://mediamtx:8881;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
