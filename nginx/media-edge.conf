# Edge for media.n-gps.com (Cloudflare -> host :80 -> this).
#
# Everything that was hitting MediaMTX's WebRTC server directly still does;
# this only carves out /media-status/ for the JT1078 media server's
# per-camera /status endpoint, which the frontend polls after a videoStart
# to tell "camera never connected" from "connected but the stream broke".
server {
    listen 80;
    server_name _;

    # Docker's embedded DNS (127.0.0.11) so proxy_pass targets below are
    # re-resolved per request instead of once at nginx startup. Without this,
    # nginx caches whatever IP a backend container had when nginx last
    # started/reloaded; if that container later restarts (crash, redeploy)
    # and gets a new IP from Docker, nginx keeps hammering the dead IP and
    # every request 502s with "connect() failed (111: Connection refused)"
    # until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;

    # JT1078 publish status: /media-status/status/{ns}/{imei}/{ch} -> jt1078:/status/...
    location /media-status/ {
        set $jt1078_upstream http://jt1078:10004;
        # A variable target in proxy_pass disables nginx's normal
        # location-prefix replacement (well-known nginx gotcha), so the
        # unstripped /media-status/... path was reaching jt1078's minimal
        # hand-rolled HTTP parser, which doesn't know that prefix and always
        # fell through to its hardcoded 404. Strip it explicitly instead.
        rewrite ^/media-status/(.*)$ /$1 break;
        proxy_pass $jt1078_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
        proxy_connect_timeout 3s;
    }

    # Event attachments: frontend GETs /attachments/{imei}/{label}[/{file}].
    # Cameras POST directly to host:10005/upload, not through here.
    location /attachments/ {
        set $upload_upstream http://upload:10005;
        # A URI after a variable proxy_pass replaces the whole request path
        # (same gotcha as /media-status/ above). $upload_upstream/attachments/
        # was forwarding every request as exactly GET /attachments/, which
        # matches no upload route and 404s. The upload app serves the
        # original /attachments/... path, so pass it through unchanged.
        proxy_pass $upload_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 3s;
    }

    # Everything else: MediaMTX WebRTC / WHEP signalling and player.
    # (ICE/media stays UDP-direct on :8189, untouched.)
    location / {
        set $mediamtx_upstream http://mediamtx:8889;
        proxy_pass $mediamtx_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
